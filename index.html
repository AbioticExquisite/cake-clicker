<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet">
    <title>cake-clicker</title>
  </head>
  <body class="flex flex-col h-screen">
 <header class="bg-pink-200 text-white italic text-5xl text-center">
    Cake Clicker
 </header>

<main class="flex flex-1">
<div class="flex-2 bg-yellow-50">
<!--clicker area-->
<p id="scoreDisplay" class="text-center text-3xl font-mono mt-3">Cash</p>

<button class="transition-tranform active:translate-y-3" id="clicker">
<img src="src/assets/cake.png" alt="cake" class="ml-25 mt-40">
</button>
</div>

<div class="flex-2 bg-red-200">
<!--upgrades area-->

</div>

<div class="flex-2 bg-green-50">
<!--store area-->
<h1 class="font-mono text-center text-3xl mt-3 mb-16">Store</h1>
<button id="upgradeOne" class="bg-blue-300 text-white font-bold py-2 px-4 rounded mt-5 ml-5" id="autoClickerUpgrade">
  <img class="w-5" src="src/assets/cursor.png" alt="">
  Auto Clicker Upgrade
</button>

<button id="upgradeTwo" class="bg-orange-300 text-white font-bold py-2 px-4 rounded mt-5 ml-5" id="clickValueUpgrade">
  <img class="w-9" src="src/assets/cash.png">Click Value Upgrade
</button>
<button class="bg-purple-300 text-white font-bold py-2 px-4 rounded mt-5 ml-5" id="multiplierUpgrade">
  Multiplier Upgrade
</button>
</div>
</main>


    <script type="module" src="/src/main.js"></script>
  </body>
</html>
